services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: dev
      DATABASE_URL: mysql://app:app@database:3306/blissim?serverVersion=8.0&charset=utf8mb4
    volumes:
      - .:/app
      - /app/var
    depends_on:
      database:
        condition: service_healthy
    command: >
      sh -c "composer install --no-interaction
      && php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
      && php -S 0.0.0.0:8000 -t public public/index.php"

  database:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: blissim
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - database_data:/var/lib/mysql
      - ./blissim.sql:/docker-entrypoint-initdb.d/blissim.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  database_data:
